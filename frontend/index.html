<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lamp control</title>
	</head>
	<body>
		<div class="header">
			<div id="header-left">
				<button id="power" class="btn-active keep" title="power" onclick="toggleOnOff()">
					<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
						<path
							d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-84 31.5-156.5T197-763l56 56q-44 44-68.5 102T160-480q0 134 93 227t227 93q134 0 227-93t93-227q0-67-24.5-125T707-707l56-56q54 54 85.5 126.5T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm-40-360v-440h80v440h-80Z"
						/>
					</svg>
				</button>
				<button id="visualize" class="btn-active keep" onclick="toggleVisualize()">
					<svg
						id="icon-visualize-shown"
						xmlns="http://www.w3.org/2000/svg"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="var(--white)"
					>
						<path
							d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"
						/>
					</svg>
					<svg
						id="icon-visualize-hidden"
						xmlns="http://www.w3.org/2000/svg"
						height="24px"
						viewBox="0 -960 960 960"
						width="24px"
						fill="var(--white)"
					>
						<path
							d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z"
						/>
					</svg>
					<p>Visualize</p>
				</button>
			</div>
			<button id="list" class="btn-active keep" onclick="toggleList(true)">
				<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
					<path
						d="M280-600v-80h560v80H280Zm0 160v-80h560v80H280Zm0 160v-80h560v80H280ZM160-600q-17 0-28.5-11.5T120-640q0-17 11.5-28.5T160-680q17 0 28.5 11.5T200-640q0 17-11.5 28.5T160-600Zm0 160q-17 0-28.5-11.5T120-480q0-17 11.5-28.5T160-520q17 0 28.5 11.5T200-480q0 17-11.5 28.5T160-440Zm0 160q-17 0-28.5-11.5T120-320q0-17 11.5-28.5T160-360q17 0 28.5 11.5T200-320q0 17-11.5 28.5T160-280Z"
					/>
				</svg>
			</button>
		</div>
		<div id="timeline">
			<p class="font-header color-white">Timeline <span class="font-regular font-descriptive" id="font-header-info">1h</span></p>
			<div id="timeline-inner">
				<button
					class="time-entry clone"
					onclick="focusTimeEntry(this)"
					ontouchstart="initLongPress(this)"
					onmousedown="initLongPress(this)"
					ontouchend="cancelLongPress()"
					onmouseup="cancelLongPress()"
					ontouchcancel="cancelLongPress()"
					onmouseleave="cancelLongPress()"
				>
					<div class="time-entry-text">
						<p class="time-entry-time font-header">1</p>
						<p class="time-entry-unit font-small">min</p>
					</div>
				</button>
				<button id="timeline-add" onclick="addTimeEntry()">
					<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white">
						<path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
					</svg>
				</button>
			</div>
		</div>
		<div id="widgets">
			<div class="widget">
				<p class="widget-header">Color Type</p>
				<div class="widget-body simple-select">
					<button class="btn-active remove-active type-0" onclick="changeType(0)">Solid</button>
					<!--<button class="btn-inactive type-1" onclick="changeType(1)">Gradient</button>-->
					<button class="btn-inactive type-2" onclick="changeType(2)">Draw</button>
				</div>
			</div>
			<div class="color-widget color-widget-0">
				<p id="color-widget-header">Color</p>
				<button onclick="openSolidColorPicker()"></button>
				<input type="color" id="solidColorInput" onchange="setColor(this.value)" />
			</div>
			<div class="color-widget-2">
				<p id="color-widget-header">Drawing</p>
				<canvas id="color-draw"></canvas>
				<input type="color" id="drawColorInput" onchange="changeDrawTypeColor(this.value)" />
				<button id="draw-colorpicker" onclick="openDrawColorPicker()"></button>
			</div>
			<div class="widget">
				<p class="widget-header">Duration</p>
				<div class="widget-body duration-widget">
					<button class="btn-filled" onclick="changeDuration(-1)">
						<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white">
							<path d="M200-440v-80h560v80H200Z" />
						</svg>
					</button>
					<div class="duration-middle">
						<input type="number" id="duration-teller" onchange="changeDuration(this.value)" min="0" max="10000" value="10" />
						<p id="duration-unit">min</p>
					</div>
					<button class="btn-filled" onclick="changeDuration(1)">
						<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white">
							<path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
						</svg>
					</button>
				</div>
			</div>
			<div class="widget">
				<p class="widget-header">Duration type</p>
				<div class="widget-body simple-select">
					<button class="btn-inactive duration-h" onclick="changeUnit('h')">Hours</button>
					<button class="btn-inactive duration-min" onclick="changeUnit('min')">Minutes</button>
					<button class="btn-active remove-active duration-s" onclick="changeUnit('s')">Seconds</button>
				</div>
			</div>
			<div class="widget-halfed">
				<div class="widget">
					<p class="widget-header">Lamp<br />Wakeup</p>
					<div class="widget-body">
						<input type="time" class="lamp-wake wakeup" />
					</div>
				</div>
				<div class="widget">
					<p class="widget-header">Lamp<br />Sleep</p>
					<div class="widget-body">
						<input type="time" class="lamp-wake sleep" />
					</div>
				</div>
			</div>
			<div id="save-preset">
				<p class="font-header">Save as preset</p>
				<input type="text" placeholder="Preset title" id="save-preset-title" maxlength="50" />
				<textarea placeholder="Preset description" id="save-preset-desc" maxlength="100" rows="5"></textarea>
				<button onclick="savePreset()">Save as preset</button>
			</div>
		</div>
		<div id="snackbar">
			<p id="snackbar-text" class="color-black">test</p>
		</div>
		<div id="presets-list">
			<div class="header header-list">
				<button id="close-list" class="btn-active keep" onclick="toggleList(false)">
					<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
						<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>
			</div>
			<p class="font-header color-white">Presets <span id="presets-amount" class="font-regular">0</span></p>
			<div id="presets">
				<div class="preset clone">
					<div class="preset-left">
						<p class="preset-title font-semiHeader">This is a Preset test</p>
						<p class="preset-description font-descriptive">Preset description</p>
					</div>
					<div class="preset-right">
						<button class="preset-more">
							<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
								<path
									d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"
								/>
							</svg>
						</button>
						<button class="preset-play">
							<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
								<path d="M320-200v-560l440 280-440 280Zm80-280Zm0 134 210-134-210-134v268Z" />
							</svg>
						</button>
					</div>
				</div>
			</div>
		</div>
		<div id="timeline-interacter-popup">
			<div id="timeline-interacter-header">
				<p>Time entry settings</p>
				<button id="close-timeline-interacter" onclick="toggleColorEntrySettings(false)">
					<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="var(--white)">
						<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
					</svg>
				</button>
			</div>
			<div id="timeline-interacter-options">
				<button onclick="deleteTimeEntry()">Delete timeline entry</button>
				<button onclick="duplicateTimeEntry()">Duplicate timeline entry</button>
				<button onclick="moveTimeEntry(-1)">Move one left</button>
				<button onclick="moveTimeEntry(1)">Move one right</button>
			</div>
		</div>
	</body>
	<style>
		* {
			margin: 0;
			box-sizing: border-box;
		}
		p,
		button,
		input,
		textarea {
			color: white;
			font-size: var(--regular);
			font-family: Arial, Helvetica, sans-serif;
		}
		:root {
			--white: #ffffff;
			--black: #000000;
			--bg: #1c1c1c;
			--grey: #575757;
			--red: #ff4d4d;
			--areaHighlight: #212121;

			--radius: 20px;
			--margin: 10px;

			--header: 2rem;
			--semiHeader: 1.2rem;
			--regular: 1rem;
			--small: 0.7rem;
		}
		body {
			background-color: var(--bg);
			padding: var(--margin);
			max-width: 600px;
			margin: 0 auto;
		}

		/*global styles*/
		.font-header {
			font-size: var(--header);
		}
		.font-semiHeader {
			font-size: var(--semiHeader);
		}
		.font-regular {
			font-size: var(--regular);
		}
		.font-small {
			font-size: var(--small);
		}
		.font-descriptive {
			opacity: 0.8;
		}
		.color-white {
			color: var(--white);
		}
		.color-black {
			color: var(--black);
		}

		.bold {
			font-weight: 600;
		}
		.btn-active,
		.btn-inactive,
		.btn-filled {
			padding: calc(var(--margin) * 1.5) var(--margin);
			border-radius: 500px;
		}
		.btn-active {
			background-color: transparent;
			border: 1px solid var(--white);
		}
		.btn-inactive {
			background-color: transparent;
			border: 1px solid var(--grey);
		}
		.btn-filled {
			background-color: var(--grey);
			border: none;
		}

		/*header*/
		.header {
			position: relative;
			display: flex;
			justify-content: space-between;
			margin-bottom: calc(var(--margin) * 4);
		}
		#header-left {
			display: flex;
			gap: calc(var(--margin) / 2);
		}
		#power {
			aspect-ratio: 1;
			padding: calc(var(--margin) * 1.5);
			display: flex;
		}
		#visualize {
			display: flex;
			gap: var(--margin);
			align-items: center;
			padding: calc(var(--margin) * 1.5);
		}
		#icon-visualize-hidden {
			display: none;
		}
		#list,
		#close-list {
			aspect-ratio: 1;
			padding: calc(var(--margin) * 1.5);
			display: flex;
		}

		/*timeline*/
		#timeline {
			margin-bottom: calc(var(--margin) * 4);
		}
		#timeline-inner {
			display: flex;
			overflow-x: scroll;
		}
		.time-entry {
			background-color: red;
			padding: var(--margin) 0;
			border-radius: calc(var(--radius) / 2);
			border: none;
			flex-shrink: 0;
			display: flex;
		}
		.time-entry.clone {
			display: none;
		}
		.time-entry-text {
			position: sticky;
			left: 0;
			padding: 0 var(--margin);
		}
		.time-entry-text > p {
			color: var(--black);
			pointer-events: none;
		}
		#timeline-add {
			background-color: transparent;
			border-radius: calc(var(--radius) / 2);
			border: none;
			padding: 0 calc(var(--margin) * 2);
			margin-left: calc(var(--margin) / 2);
		}

		#timeline-interacter-popup {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			background-color: var(--areaHighlight);
			border-radius: var(--radius) var(--radius) 0 0;
			padding: var(--margin);
			transition: all 0.2s;
			transform: translateY(100%);
			opacity: 0;
			-webkit-box-shadow: 0px 0px 15px 0px var(--black);
			box-shadow: 0px 0px 15px 0px var(--black);
		}
		#timeline-interacter-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: var(--margin);
		}
		#timeline-interacter-header > button {
			background-color: transparent;
			border: none;
			margin: 0;
			padding: calc(var(--margin) / 2);
		}
		#timeline-interacter-options {
			max-height: 50vh;
			overflow-y: scroll;
			display: flex;
			flex-direction: column;
			gap: calc(var(--margin) / 2);
		}
		#timeline-interacter-options > button {
			background-color: transparent;
			padding: var(--margin);
			border-radius: 100px;
			border: 1px solid var(--grey);
		}
		/*widgets*/
		#widgets {
			display: flex;
			flex-direction: column;
			gap: calc(var(--margin) / 2);
		}
		.widget-halfed {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			grid-column-gap: calc(var(--margin) / 2);
		}
		.widget {
			background-color: var(--areaHighlight);
			padding: calc(var(--margin) * 1.5);
			border-radius: var(--radius);
			border: 1px solid var(--grey);
			min-height: 40vw;
			display: flex;
			flex-direction: column;
		}
		.widget > .widget-header {
			flex-grow: 1;
		}

		.simple-select {
			display: flex;
			flex-wrap: wrap;
		}
		.simple-select > button {
			flex-grow: 1;
		}

		/*color widgets*/
		.color-widget {
			background-color: blue;
			border-radius: var(--radius);
			min-height: 45vw;
			position: relative;
		}
		.color-widget > button {
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: transparent;
			border: none;
		}
		.color-widget > input {
			position: absolute;
			visibility: hidden;
		}
		#color-widget-header {
			padding: calc(var(--margin) * 1.5);
			pointer-events: none;
			color: var(--black);
		}

		/*color widget draw*/
		.color-widget-2 {
			border: 1px solid var(--grey);
			border-radius: var(--radius);
		}
		.color-widget-2 > p {
			color: var(--white) !important;
			position: absolute;
		}
		#color-draw {
			width: 100%;
			aspect-ratio: 1;
		}
		#draw-colorpicker {
			width: calc(var(--margin) * 4);
			height: calc(var(--margin) * 4);
			background-color: var(--white);
			margin: 0 0 var(--margin) var(--margin);
			border-radius: 100px;
			border: none;
		}
		#drawColorInput {
			display: none;
		}

		/*lamp wakeup and sleep*/
		.lamp-wake {
			background-color: transparent;
			border: none;
			font-size: var(--header);
			padding: 0;
			width: 100%;
		}

		/*duration*/
		.duration-widget {
			display: flex;
		}
		.duration-widget > button {
			aspect-ratio: 1;
			flex-shrink: 0;
			padding: calc(var(--margin) * 1.5);
		}
		.duration-middle {
			display: flex;
			flex-grow: 1;
			justify-content: center;
			align-items: center;
		}
		.duration-middle > input {
			font-size: var(--header);
			background-color: transparent;
			width: 4rem;
			border: none;
		}

		/*save preset*/
		#save-preset {
			display: flex;
			flex-direction: column;
			margin-top: calc(var(--margin) * 4);
		}
		#save-preset > .font-header {
			margin-bottom: var(--margin);
		}
		#save-preset > input {
			background-color: transparent;
			border: none;
			font-size: var(--semiHeader);
			margin-bottom: calc(var(--margin) / 2);
		}
		#save-preset > textarea {
			background-color: transparent;
			border: none;
			opacity: 0.8;
		}
		#save-preset > button {
			margin-top: var(--margin);
			background-color: transparent;
			padding: calc(var(--margin) * 1.5);
			border-radius: 100px;
			border: 1px solid var(--grey);
		}

		/*snackbar*/
		#snackbar {
			width: calc(100% - 2 * var(--margin));
			background-color: var(--white);
			position: fixed;
			bottom: 0px;
			transform: translateY(0px);
			border-radius: calc(var(--radius) / 2);
			padding: var(--margin);
			opacity: 0;
			pointer-events: none;
			transition: all 0.2s;
			z-index: 999;
		}

		/*presets list*/
		#presets-list {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: var(--bg);
			padding: var(--margin);
			overflow-y: scroll;
			display: none;
		}
		.header-list {
			justify-content: flex-end;
		}
		#presets {
			display: flex;
			flex-direction: column;
			gap: calc(var(--margin) / 2);
		}
		.preset {
			background-color: var(--areaHighlight);
			padding: var(--margin);
			border-radius: calc(var(--radius) / 2);
			display: flex;
			align-items: center;
		}
		.preset.clone {
			display: none;
		}
		.preset-left {
			flex-grow: 1;
		}
		.preset-title {
			margin-bottom: calc(var(--margin) / 2);
		}
		.preset-right {
			display: flex;
			align-items: center;
			gap: var(--margin);
		}
		.preset-more,
		.preset-play {
			background-color: transparent;
			margin: 0;
			padding: calc(var(--margin) / 2);
			border: none;
		}
	</style>
	<script>
		let gateway = `ws://${window.location.hostname}/ws`;
		let websocket;

		function openSolidColorPicker() {
			document.querySelector("#solidColorInput").click();
		}
		function openDrawColorPicker() {
			document.querySelector("#drawColorInput").click();
		}
		let visualizeChanges = true;
		function toggleVisualize() {
			visualizeChanges = !visualizeChanges;
			document.querySelector("#visualize").style.opacity = visualizeChanges ? 1 : 0.3;
			document.querySelector("#icon-visualize-shown").style.display = visualizeChanges ? "block" : "none";
			document.querySelector("#icon-visualize-hidden").style.display = visualizeChanges ? "none" : "block";

			if (visualizeChanges) {
				sendData();
			}
		}
		function toggleList(show) {
			let listView = document.querySelector("#presets-list");
			let body = document.querySelector("body");
			if (show) {
				listView.style.display = "block";
				body.style.overflow = "hidden";
				loadPresets();
			} else {
				listView.style.display = "none";
				body.style.overflow = "auto";
			}
		}
		let pressTimer;
		function initLongPress(elem) {
			focusTimeEntry(elem);
			pressTimer = window.setTimeout(() => {
				toggleColorEntrySettings(true);
			}, 500);
		}
		function cancelLongPress() {
			clearTimeout(pressTimer);
		}
		function toggleColorEntrySettings(show) {
			let timelineInt = document.querySelector("#timeline-interacter-popup");
			if (show) {
				timelineInt.style.transform = "translateY(0%)";
				timelineInt.style.opacity = 1;
			} else {
				timelineInt.style.transform = "translateY(100%)";
				timelineInt.style.opacity = 0;
			}
		}
		let data = {
			on: false,
			restart: true,
			activeTime: 0,
			activeColor: 0,
			times: [
				{
					t: 13,
					u: 1, // 0 = seconds, 1 = minutes, 2 = hours
					c: [16777215], // white in color_int
					p: 0, // 0 = solid / 1 = gradient / 2 = draw
				},
			],
		};

		function toggleOnOff() {
			data.on = !data.on;
			render();
		}

		function focusTimeEntry(elem) {
			if (elem == undefined) {
				data.activeTime = data.times.length - 1;
				return;
			}
			let indexOfClickedEntry = elem.getAttribute("index");
			data.activeTime = parseInt(indexOfClickedEntry);
			render(true);
		}

		function addTimeEntry(indexToAddAfter, elem) {
			if (indexToAddAfter == undefined) {
				indexToAddAfter = data.times.length;
			}
			let elemToAdd = { t: 1, u: 1, c: [16777215], p: 0 };
			if (elem) {
				elemToAdd = elem;
			}
			data.times.splice(indexToAddAfter, 0, elemToAdd);
			focusTimeEntry();
			render();
		}

		function deleteTimeEntry() {
			if (data.times.length === 1) return;
			if (window.confirm("Delete the timestamp?")) {
				data.times.splice(data.activeTime, 1);
				if (data.activeTime > 0) {
					data.activeTime -= 1;
				}
				render();
			}
		}

		function duplicateTimeEntry() {
			let clonedEntry = structuredClone(data.times[data.activeTime]);
			addTimeEntry(data.activeTime, clonedEntry);
			render();
		}
		function moveTimeEntry(direction) {
			if (direction == -1 && data.activeTime == 0) return;
			if (direction == 1 && data.activeTime == data.times.length - 1) return;
			const elem = data.times.splice(data.activeTime, 1)[0];
			data.times.splice(data.activeTime + direction, 0, elem);
			data.activeTime += direction;
			render();
		}

		function changeType(type) {
			data.times[data.activeTime].p = type;
			render();
		}

		function setColor(color) {
			data.times[data.activeTime].c[0] = convertToColorInt(color);
			render();
		}
		function convertToColorInt(color) {
			const colorInt = parseInt(color.replace("#", ""), 16);
			return colorInt;
		}

		let canvas, ctx;
		const rects = [
			{ x: 20, y: 70, width: 60, height: 10 }, // top part
			{ x: 20, y: 35, width: 60, height: 30 }, // big middle part
			{ x: 20, y: 20, width: 60, height: 10 }, // bottom part
			{ x: 85, y: 35, width: 10, height: 30 }, // left part
			{ x: 5, y: 35, width: 10, height: 30 }, // right part
		];

		function initDrawCanvas() {
			canvas = document.querySelector("#color-draw");
			ctx = canvas.getContext("2d");
			ctx.lineWidth = 20;
			ctx.lineCap = "round";
			ctx.lineJoin = "round";

			let canvasWidth = canvas.getBoundingClientRect().right - canvas.getBoundingClientRect().left;
			canvas.width = canvasWidth;
			canvas.height = canvasWidth;

			let canvasNormalized = canvas.width / 100;
			rects.forEach((el) => {
				el.x_n = canvasNormalized * el.x;
				el.y_n = canvasNormalized * el.y;
				el.width_n = canvasNormalized * el.width;
				el.height_n = canvasNormalized * el.height;
			});

			ctx.save();
			ctx.fillStyle = "#575757";
			rects.forEach((el) => {
				ctx.fillRect(el.x_n, el.y_n, el.width_n, el.height_n);
			});
			ctx.restore();

			ctx.save();
			ctx.beginPath();
			rects.forEach((el) => {
				ctx.rect(el.x_n, el.y_n, el.width_n, el.height_n);
			});
			ctx.clip();
			ctx.lineWidth = 20;
			ctx.lineCap = "round";
			ctx.lineJoin = "round";

			initDrawListeners();
		}
		initDrawCanvas();

		let drawing = false;

		function getPosition(event) {
			const rect = canvas.getBoundingClientRect();
			if (event.touches && event.touches.length > 0) {
				// Touch-Event
				return {
					x: event.touches[0].clientX - rect.left,
					y: event.touches[0].clientY - rect.top,
				};
			} else {
				// Mouse-Event
				return {
					x: event.clientX - rect.left,
					y: event.clientY - rect.top,
				};
			}
		}

		function beginDraw(event) {
			event.preventDefault();
			drawing = true;
			const { x, y } = getPosition(event);
			ctx.strokeStyle = currentDrawingColor;
			ctx.beginPath();
			ctx.moveTo(x, y);
		}

		function progressDraw(event) {
			if (!drawing) return;
			event.preventDefault();
			const { x, y } = getPosition(event);
			ctx.lineTo(x, y);
			ctx.stroke();

			calculateDrawedColorArray(x, y);
		}

		function stopDraw(event) {
			drawing = false;
			ctx.closePath();
		}

		function initDrawListeners() {
			canvas.addEventListener("mousedown", beginDraw);
			canvas.addEventListener("mousemove", progressDraw);
			canvas.addEventListener("mouseup", stopDraw);
			canvas.addEventListener("mouseleave", stopDraw);

			canvas.addEventListener("touchstart", beginDraw, { passive: false });
			canvas.addEventListener("touchmove", progressDraw, { passive: false });
			canvas.addEventListener("touchend", stopDraw, { passive: false });
			canvas.addEventListener("touchcancel", stopDraw, { passive: false });
		}

		function removeDrawListeners() {
			// Beispiel: canvas.removeEventListener(...)
		}

		let currentDrawingColor = "#ffffff";
		function changeDrawTypeColor(color) {
			currentDrawingColor = color;
			document.querySelector("#draw-colorpicker").style.backgroundColor = color;
		}

		let ledIndexes = [
			// top part
			[
				[36, 37, 38, 39, 40, 41, 42, 43, 44],
				[7, 8, 9, 10, 11, 12, 13, 14, 15],
			],
			// middle part
			[
				[56, 55, 54, 53, 52, 51, 50, 49],
				[57, 58, 59, 60, 61, 62, 63, 64],
				[72, 71, 70, 69, 68, 67, 66, 65],
				[73, 74, 75, 76, 77, 78, 79, 80],
				[88, 87, 86, 85, 84, 83, 82, 81],
				[89, 90, 91, 92, 93, 94, 95, 96],
			],
			// bottom part
			[
				[1, 0, -1, -1, -1, -1, -1, -1, 22, 21],
				[31, 30, 29, 28, 27, 26, 25, 24, 23, -1],
			],
			// left part
			[
				[20, -1],
				[19, 48],
				[18, 47],
				[-1, 46],
				[17, 45],
				[16, -1],
			],
			// right part
			[
				[-1, 2],
				[32, 3],
				[33, 4],
				[34, -1],
				[35, 5],
				[-1, 6],
			],
		];
		let buildLedArray = Array(96).fill(0);
		console.log(buildLedArray);
		let xStep = 0;
		let yStep = 0;
		let lastCalculatedIndex = -1;
		function calculateDrawedColorArray(x, y) {
			let currentIndex = -1;
			for (let i = 0; i < rects.length; i++) {
				let entry = rects[i];
				// first check which area the cursor is on and skip the remaining
				if (x >= entry.x_n && x < entry.x_n + entry.width_n && y >= entry.y_n && y < entry.y_n + entry.height_n) {
					currentIndex = i;
					// calculate size of led area
					xStep = entry.width_n / ledIndexes[i][0].length;
					yStep = entry.height_n / ledIndexes[i].length;
					break;
				}
			}
			if (currentIndex == -1) return;

			let xLed = Math.floor((x - rects[currentIndex].x_n) / xStep);
			let yLed = Math.floor((y - rects[currentIndex].y_n) / yStep);
			let calculatedIndex = ledIndexes[currentIndex][yLed][xLed];
			buildLedArray[calculatedIndex] = convertToColorInt(currentDrawingColor);
			console.log(buildLedArray);
			data.times[data.activeTime].c = buildLedArray;

			if (calculatedIndex !== lastCalculatedIndex && visualizeChanges) {
				sendData();
			}

			lastCalculatedIndex = calculatedIndex;
		}

		function changeDuration(type) {
			if (type == 1 || type == -1) {
				data.times[data.activeTime].t += 1 * type;
			} else {
				data.times[data.activeTime].t = parseInt(type);
			}
			if (data.times[data.activeTime].t < 1) data.times[data.activeTime].t = 1;
			render();
		}

		function changeUnit(unit = "min") {
			data.times[data.activeTime].u = convertTimeUnit(unit);
			render();
		}

		function convertTimeUnit(entry) {
			if (typeof entry == "string") {
				if (entry == "s") {
					return 0;
				} else if (entry == "min") {
					return 1;
				} else {
					return 2;
				}
			} else if (typeof entry == "number") {
				if (entry == 0) {
					return "s";
				} else if (entry == 1) {
					return "min";
				} else {
					return "h";
				}
			}
		}

		function render(blockLampUpdate = false) {
			let timelineParent = document.querySelector("#timeline-inner");
			let toDelete = document.querySelectorAll(".delete-on-rerender");
			let buttonsToReset = document.querySelectorAll(".btn-active");
			toDelete.forEach((el, i) => {
				el.remove();
			});
			buttonsToReset.forEach((el) => {
				if (!el.classList.contains("keep")) {
					el.classList.remove("btn-active");
					el.classList.add("btn-inactive");
				}
			});
			let accumulatedSeconds = 0;
			data.times.forEach((timeEntry, i) => {
				let clonedEntry = timelineParent.querySelector(".time-entry.clone").cloneNode(true);
				clonedEntry.classList.remove("clone");
				clonedEntry.classList.add("delete-on-rerender");
				let firstColor = timeEntry.c[0] || 16777215;
				clonedEntry.style.backgroundColor = "#" + firstColor.toString(16).padStart(6, "0");
				clonedEntry.style.width = `calc(1rem + var(--margin) + ${timeEntry.t} * var(--margin))`;
				clonedEntry.querySelector(".time-entry-time").innerText = timeEntry.t;
				clonedEntry.querySelector(".time-entry-unit").innerText = convertTimeUnit(timeEntry.u);
				clonedEntry.setAttribute("index", i);
				if (i === data.activeTime) {
					clonedEntry.querySelector(".time-entry-time").classList.add("bold");
				}
				timelineParent.insertBefore(clonedEntry, timelineParent.childNodes[timelineParent.childNodes.length - 2]);

				console.log(timeEntry.u);
				if (timeEntry.u == 0) {
					accumulatedSeconds += timeEntry.t;
				} else if (timeEntry.u == 1) {
					accumulatedSeconds += timeEntry.t * 60;
				} else {
					accumulatedSeconds += timeEntry.t * 60 * 60;
				}
			});
			document.querySelector("#power").style.opacity = data.on ? 1 : 0.3;
			let hoursOfTimeline = Math.floor(accumulatedSeconds / 3600);
			accumulatedSeconds = accumulatedSeconds - hoursOfTimeline * 3600;
			let minutesOfTimeline = Math.floor(accumulatedSeconds / 60);
			let secondsOfTimeline = accumulatedSeconds - minutesOfTimeline * 60;
			document.querySelector("#font-header-info").innerText = `${hoursOfTimeline}h ${minutesOfTimeline}min ${secondsOfTimeline}s`;
			let foundTypeActiveBtn = document.querySelector(`.type-${data.times[data.activeTime].p}`);
			foundTypeActiveBtn.classList.remove("btn-inactive");
			foundTypeActiveBtn.classList.add("btn-active");

			// color
			if (data.times[data.activeTime].p == 0) {
				let c = data.times[data.activeTime].c[0] || 16777215;
				document.querySelector(".color-widget").style.backgroundColor = "#" + c.toString(16).padStart(6, "0");
				document.querySelector(".color-widget-2").style.display = "none";
				document.querySelector(".color-widget-0").style.display = "block";
			} else if (data.times[data.activeTime].p == 2) {
				document.querySelector(".color-widget-2").style.display = "block";
				document.querySelector(".color-widget-0").style.display = "none";
			}

			document.querySelector("#duration-teller").value = data.times[data.activeTime].t;
			document.querySelector("#duration-unit").innerText = convertTimeUnit(data.times[data.activeTime].u);
			let foundDurationActiveBtn = document.querySelector(`.duration-${convertTimeUnit(data.times[data.activeTime].u)}`);
			foundDurationActiveBtn.classList.remove("btn-inactive");
			foundDurationActiveBtn.classList.add("btn-active");

			if (visualizeChanges && !blockLampUpdate) {
				console.log("sending data ...");
				sendData();
			}
		}
		render();

		// 1. Initialize the connection
		function initWebSocket() {
			console.log("Trying to open a WebSocket connection...");
			websocket = new WebSocket(gateway);

			websocket.onopen = onOpen;
			websocket.onclose = onClose;
			websocket.onmessage = onMessage;
		}

		function onOpen(event) {
			console.log("Connection opened");
			snackbar("Connected to lamp");
		}

		function onClose(event) {
			console.log("Connection closed");
			// Try to reconnect every 2 seconds
			setTimeout(initWebSocket, 2000);
			snackbar("Connection lost, retrying in 2 seconds", true);
		}

		// 2. Handle incoming data from the ESP8266
		function onMessage(event) {
			console.log("unparsed:", event);
			data = JSON.parse(event.data);
			console.log("Received state from ESP:", data);
			render(true);
		}

		// 3. Send data to the ESP8266
		function sendData() {
			if (websocket && websocket.readyState === WebSocket.OPEN) {
				websocket.send(JSON.stringify(data));
			}
		}

		// Start the connection when the page loads
		window.addEventListener("load", initWebSocket);

		async function savePreset() {
			const MAX_TITLE_LENGTH = 50;
			const MAX_DESC_LENGTH = 100;
			let title = document.querySelector("#save-preset-title");
			let desc = document.querySelector("#save-preset-desc");
			if (!title.value || title.value.length == 0) {
				snackbar("Preset must have a title", true);
				return;
			}
			if (title.value.length > MAX_TITLE_LENGTH) {
				snackbar(`Title mustn't be longer than ${MAX_TITLE_LENGTH} characters`, true);
				return;
			}
			if (desc.value.length > MAX_DESC_LENGTH) {
				snackbar(`Description mustn't be longer than ${MAX_DESC_LENGTH} characters`, true);
				return;
			}
			let presetToSave = structuredClone(data);
			presetToSave.title = title.value;
			presetToSave.desc = desc.value;

			try {
				let res = await fetch("/preset", {
					method: "POST",
					body: JSON.stringify(presetToSave),
				});
				if (!res.ok) {
					throw new Error("Fetch request failed");
				}
				let json = await res.json();
				console.log(res, json);
				snackbar("Saved preset");
			} catch (e) {
				console.error(e);
				snackbar("Failed to save preset", true);
			}
		}

		function renderPresets(presets) {
			let presetBody = document.querySelector("#presets");
			let toDelete = document.querySelectorAll(".preset-delete-on-rerender");
			toDelete.forEach((el, i) => {
				el.remove();
			});
			presets.forEach((el) => {
				let cloned = presetBody.querySelector(".preset.clone").cloneNode(true);
				cloned.classList.remove("clone");
				cloned.classList.add("preset-delete-on-rerender");
				cloned.querySelector(".preset-title").innerText = el.title;
				let presetDesc = cloned.querySelector(".preset-description");
				if (!el.desc || el.desc.length == 0) {
					presetDesc.style.display = "none";
				} else {
					cloned.querySelector(".preset-description").innerText = el.desc;
				}
				cloned.setAttribute("filename", el.filename);
				presetBody.insertBefore(cloned, presetBody.childNodes[presetBody.childNodes.length]);
			});
		}

		async function loadPresets() {
			try {
				const response = await fetch("/presets");
				if (!response.ok) {
					throw new Error(`HTTP error! status: ${response.status}`);
				}
				const presets = await response.json();

				console.log("Presets loaded:", presets);
				document.querySelector("#presets-amount").innerText = presets.length;
				renderPresets(presets);
			} catch (error) {
				console.error("Could not fetch presets:", error);
				snackbar("Couldn't load presets", true);
			}
		}

		function snackbar(msg, isError = false) {
			let elem = document.querySelector("#snackbar");
			let txt = document.querySelector("#snackbar-text");
			txt.innerText = msg;

			elem.style.backgroundColor = isError ? "var(--red)" : "var(--white)";

			elem.style.transform = "translateY(calc(var(--margin) * -1))";
			elem.style.opacity = 1;
			elem.style.pointerEvents = "all";

			setTimeout(
				() => {
					elem.style.transform = "translateY(0px)";
					elem.style.opacity = 0;
					elem.style.pointerEvents = "none";
				},
				isError ? 5000 : 1500
			);
		}
	</script>
</html>
